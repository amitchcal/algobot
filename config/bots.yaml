# Bot definitions. Edit via the dashboard (recommended) or by hand.
# Schema matches config/store.py BOT_TYPES. Credentials are NOT stored here
# — see config/secrets.yaml (gitignored).

bots:
  - id: intraday_stock_1
    bot_type: intraday_stock
    label: "Intraday Stock Bot — Nifty 500"
    active: false
    broker: zerodha_kite
    paper_mode: true
    strategy: hilega_milega
    capital_deployed: 50000
    lot_size: 1
    # Manual watchlist — full Nifty 500 auto-scanning isn't wired up yet
    # (that needs the Chartink/scanner piece). Until then, the live runner
    # only evaluates symbols listed here.
    watchlist: [RELIANCE, TCS, HDFCBANK, INFY, ICICIBANK]
    commodity_symbols: []
    expiry_preference: null
    strike_selection: null
    tsl: {mode: percent, trail_value: 1.0, activate_after: 0.0}
    trading_window: {start: "09:20", end: "15:15"}
    max_daily_loss: 5000

